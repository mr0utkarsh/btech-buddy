# BTech Buddy — full-stack stack file
# Backend: FastAPI + PyMuPDF watermarking
# Frontend: React + Vite (build with `npm run build` in frontend/)
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  # Optional: serve the built frontend with a static server.
