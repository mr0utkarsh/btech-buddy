<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BTech Buddy — find, preview and download previous-year question papers for CSE (AI & Robotics) students at Shri Mata Vaishno Devi University (SMVDU), Katra."
    />
    <meta name="theme-color" content="#0f2440" />
    <meta property="og:title" content="BTech Buddy — Previous Year Question Papers" />
    <meta
      property="og:description"
      content="Free previous-year question papers for engineering students. Preview and download watermarked PDFs."
    />
    <meta property="og:type" content="website" />
    <title>BTech Buddy — Previous Year Question Papers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the saved theme before React mounts to avoid a flash of the
      // wrong theme. Mirrors ThemeContext.getStoredTheme(). Default: clean.
      (function () {
        try {
          var t = localStorage.getItem("btechbuddy:theme");
          if (t === "dark" || t === "clean" || t === "hybrid") {
            document.documentElement.setAttribute("data-theme", t);
            var colors = { dark: "#070d1a", clean: "#ffffff", hybrid: "#0a1024" };
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", colors[t]);
          } else {
            document.documentElement.setAttribute("data-theme", "clean");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "clean");
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
