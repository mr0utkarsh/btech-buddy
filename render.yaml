# BTech Buddy — Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# Create the service from this file (Dashboard > Blueprint, or `render blueprint`),
# then set these environment variables in the Render dashboard (Settings > Env):
#   SUPABASE_URL               https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  (Project Settings > API — secret, never in this file)
#   SUPABASE_JWT_SECRET        (only for older HS256 projects)
#   INITIAL_SUPER_ADMIN_EMAIL  e.g. admin@example.com
#   INITIAL_SUPER_ADMIN_PASSWORD  strong password (or use the one-time /setup flow)
#   CORS_ORIGINS               https://your-frontend-url.vercel.app
#   API_BASE_URL               https://btech-buddy-backend.onrender.com
#
# The Dockerfile in backend/ is used as-is (EXPOSE 8000).
services:
  - type: web
    name: btech-buddy-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: starter
    envVars:
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: API_RATE_LIMIT
        value: 60/minute
      - key: DOWNLOAD_RATE_LIMIT
        value: 20/minute
      - key: PREVIEW_RATE_LIMIT
        value: 60/minute
      - key: SETUP_RATE_LIMIT
        value: 5/minute
      - key: CONTACT_RATE_LIMIT
        value: 3/hour
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: MAX_PDF_PAGES
        value: "300"
      - key: WATERMARK_TEXT
        value: BTech Buddy
      - key: STORAGE_BUCKET
        value: pdfs
