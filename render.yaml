# BTech Buddy — Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# Create the service from this file (Dashboard > New > Blueprint,
# connect github.com/mr0utkarsh/btech-buddy). Then set these
# environment variables in the Render dashboard (Service > Env):
#   SUPABASE_URL               https://putprsxpweglbiluscch.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  (Project Settings > API — secret, never in this file)
#   SUPABASE_JWT_SECRET        (only for older HS256 projects)
#   INITIAL_SUPER_ADMIN_EMAIL  vishalkumar8299@gmail.com
#   INITIAL_SUPER_ADMIN_PASSWORD (set in dashboard — never in this file)
#   API_BASE_URL               https://<this-service>.onrender.com
#
# The root Dockerfile is used (build context = repo root).
services:
  - type: web
    name: btech-buddy-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    envVars:
      - key: CORS_ORIGINS
        value: https://btech-buddy-six.vercel.app
      - key: API_RATE_LIMIT
        value: 60/minute
      - key: DOWNLOAD_RATE_LIMIT
        value: 20/minute
      - key: PREVIEW_RATE_LIMIT
        value: 60/minute
      - key: SETUP_RATE_LIMIT
        value: 5/minute
      - key: CONTACT_RATE_LIMIT
        value: 3/hour
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: MAX_PDF_PAGES
        value: "300"
      - key: WATERMARK_TEXT
        value: BTech Buddy
      - key: STORAGE_BUCKET
        value: pdfs
